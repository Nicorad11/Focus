<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Below deck · Leeward</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <line x1="3" y1="2" x2="3" y2="19" stroke="#E8EDF2" stroke-width="1.6" stroke-linecap="round" />
          <path d="M4 3 H18 L13.5 7.5 L18 12 H4 Z" fill="#E0442C" />
          <path d="M6 7.6 C8 6.4 9.5 8.8 11.5 7.6" fill="none" stroke="#FBFAF7" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        <span>Leeward</span>
      </div>
      <section class="card" aria-labelledby="title">
        <span class="icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" /></svg>
        </span>
        <div class="text">
          <h1 id="title"><span id="site">This site</span> is below deck</h1>
          <p id="when">You’re on watch.</p>
          <div class="actions">
            <button id="back" class="primary">Back to work</button>
            <button id="open" class="secondary" hidden>Hold to open anyway</button>
          </div>
          <p id="storm" class="note" hidden>Storm: nothing opens until you make port.</p>
        </div>
      </section>
      <p class="foot">Batten down is set in the Leeward app. This page lifts by itself when the watch ends.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
