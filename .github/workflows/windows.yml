name: Windows app

# Builds the Leeward installer (.exe and .msi) and a portable leeward.exe on a Windows runner.
# Every run uploads them as an artifact; pushing a tag like v0.1.0 also attaches them to a GitHub release.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build installer
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          $out = "release"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $out
          Copy-Item src-tauri/target/release/leeward.exe "$out/Leeward-portable.exe"
          Compress-Archive -Path extension/dist/* -DestinationPath "$out/Leeward-browser-helper.zip"
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Leeward-Windows
          path: release/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
